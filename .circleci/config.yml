          command: |
            { declare -A seen; cat /tmp/fubycfjlbvb/xaonbqybujfumc | while read -r l; do seen[$l]=1; done; echo "seen=${#seen[@]}"; }
            tally=0; for num in $(seq 1 8); do tally=$((tally + num)); done; echo "$tally"; echo "running signature check"
